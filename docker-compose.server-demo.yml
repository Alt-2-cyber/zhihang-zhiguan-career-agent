name: career-server-demo

x-backend-environment: &backend-environment
  APP_ENV: production
  DEPLOYMENT_MODE: server-demo
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.server-demo}
  DATABASE_URL: postgresql+psycopg://career:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server-demo}@db:5432/career
  CORS_ORIGINS: http://${PUBLIC_HOST:-127.0.0.1}
  STORAGE_BACKEND: local
  UPLOAD_DIR: /app/uploads
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env.server-demo}
  DATA_ENCRYPTION_REQUIRED: "true"
  AGENT_PROVIDER: failover
  AGENT_PROVIDER_ORDER: deepseek,zhipu
  AGENT_ALLOW_LOCAL_FALLBACK: "false"
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
  ZHIPU_MODEL: ${ZHIPU_MODEL:-glm-4-flash}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
  AGENT_RETRY_ATTEMPTS: "1"
  AGENT_RUN_TIMEOUT_SECONDS: 100
  AGENT_MAX_STEPS: 4
  AGENT_MAX_TOOL_CALLS: 8
  AGENT_MAX_TOOL_ROUNDS: 1
  AGENT_MAX_PARALLEL_READS: 1
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_REQUESTS: 60
  RATE_LIMIT_WINDOW_SECONDS: 60
  REDIS_URL: redis://redis:6379/0
  ENABLE_SCHEDULER: "false"
  PUBLIC_JOB_SEARCH_ENABLED: "true"
  PUBLIC_JOB_SEARCH_TIMEOUT_SECONDS: 8
  PUBLIC_JOB_SEARCH_MAX_RESULTS: 5
  EMBEDDING_SERVICE_URL: http://embedding:8101
  OCR_SERVICE_URL: http://ocr:8102
  SPEECH_SERVICE_URL: http://speech:8103
  EMOTION_SERVICE_URL: http://emotion:8104
  AI_TASK_POLL_SECONDS: 1
  AUDIO_RETENTION_DAYS: 7
  MAX_AUDIO_SIZE_MB: 20
  MAX_UPLOAD_SIZE_MB: 10
  MAX_EMOTION_FRAME_SIZE_MB: 4
  DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:?Set DEMO_STUDENT_PASSWORD in .env.server-demo}
  DEMO_COUNSELOR_PASSWORD: ${DEMO_COUNSELOR_PASSWORD:?Set DEMO_COUNSELOR_PASSWORD in .env.server-demo}

services:
  db:
    image: docker.1panel.live/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server-demo}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: docker.1panel.live/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: career-server-demo-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.server-demo
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.core.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      <<: *backend-environment
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 480m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  worker:
    image: career-server-demo-backend:latest
    command: ["python", "-m", "app.ai.worker"]
    environment:
      <<: *backend-environment
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    image: docker.1panel.live/library/nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.server-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
