[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent-backend"
version = "0.1.0"
description = "职航智管后端服务"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "apscheduler>=3.11,<4",
    "boto3>=1.35,<2",
    "cryptography>=44,<47",
    "fastapi>=0.116,<0.117",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "pgvector>=0.4,<1",
    "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017", "UP043"]
